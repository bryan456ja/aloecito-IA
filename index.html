<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Aloecito IA | ALOE GLOW</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#eef7e9;
  color:#183d1b;
  overflow:hidden;
}

.app{
  width:min(1000px,100%);
  height:92vh;
  min-height:0;
  margin:4vh auto;
  background:white;
  border-radius:22px;
  overflow:hidden;

  display:grid;
  grid-template-columns:280px minmax(0,1fr);

  box-shadow:0 12px 40px #0002;
}

aside{
  background:#2f7d32;
  color:white;
  padding:22px;
  overflow-y:auto;
}

h1{
  margin:0;
  font-size:23px;
}

.tag{
  font-size:12px;
  opacity:.85;
}

.avatar{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:25px;
  display:block;
  margin:25px auto;
}

.chip{
  width:100%;
  margin:6px 0;
  padding:11px;

  border:1px solid #ffffff55;
  border-radius:12px;

  background:#ffffff18;
  color:white;

  text-align:left;
  cursor:pointer;

  font-size:14px;
}

main{
  min-width:0;
  min-height:0;
  height:100%;

  display:flex;
  flex-direction:column;
}

.top{
  flex:0 0 auto;

  padding:18px;

  border-bottom:1px solid #dbe7d2;

  font-weight:bold;
  font-size:18px;
}

.chat{
  flex:1 1 auto;

  min-width:0;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:22px;

  background:#fbfdf9;

  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;

  scroll-behavior:smooth;
}

.msg{
  display:flex;
  align-items:flex-end;
  gap:8px;

  margin:12px 0;

  width:100%;
}

.user{
  justify-content:flex-end;
}

.bubble{
  max-width:75%;

  padding:13px 15px;

  border-radius:17px;

  line-height:1.45;
  font-size:14px;

  overflow-wrap:anywhere;
  word-break:break-word;
}

.bot .bubble{
  background:#edf6e8;
  border:1px solid #dcebd5;
}

.user .bubble{
  background:#2f7d32;
  color:white;
}

.mini{
  width:34px;
  height:34px;

  border-radius:50%;

  object-fit:cover;

  flex:0 0 34px;
}

.quick{
  flex:0 0 auto;

  padding:10px 18px;

  border-top:1px solid #dbe7d2;

  display:flex;
  gap:7px;

  flex-wrap:wrap;

  background:white;
}

.quick button{
  border:1px solid #cfe0c8;

  background:white;

  border-radius:18px;

  padding:8px 12px;

  color:#285c2b;

  cursor:pointer;

  font-size:14px;
}

.input{
  flex:0 0 auto;

  display:flex;
  gap:8px;

  padding:15px 18px;

  border-top:1px solid #dbe7d2;

  background:white;

  padding-bottom:
    calc(15px + env(safe-area-inset-bottom));
}

input{
  flex:1 1 auto;

  min-width:0;

  padding:13px;

  border:1px solid #cbdcc5;

  border-radius:14px;

  font-size:16px;

  outline:none;

  background:white;
}

input:focus{
  border-color:#2f7d32;
}

button.send{
  flex:0 0 auto;

  background:#2f7d32;

  color:white;

  border:0;

  border-radius:14px;

  padding:0 18px;

  font-weight:bold;

  cursor:pointer;

  font-size:14px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

@media(max-width:700px){

  body{
    background:white;
    overflow:hidden;
  }

  .app{
    width:100%;
    height:100dvh;
    min-height:0;

    margin:0;

    border-radius:0;

    display:grid;

    grid-template-columns:1fr;
    grid-template-rows:1fr;
  }

  aside{
    display:none;
  }

  main{
    width:100%;
    height:100%;
    min-width:0;
    min-height:0;
  }

  .top{
    padding:
      calc(14px + env(safe-area-inset-top))
      16px
      14px;
  }

  .chat{
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;

    padding:16px;

    -webkit-overflow-scrolling:touch;
  }

  .bubble{
    max-width:84%;
    font-size:15px;
  }

  .quick{
    padding:9px 12px;

    overflow-x:auto;
    flex-wrap:nowrap;

    -webkit-overflow-scrolling:touch;
  }

  .quick button{
    flex:0 0 auto;
    white-space:nowrap;
  }

  .input{
    padding:
      10px
      12px
      calc(10px + env(safe-area-inset-bottom));
  }

  input{
    font-size:16px;
    min-width:0;
  }

  button.send{
    padding:0 16px;
  }

}

</style>

</head>


<body>

<div class="app">

  <aside>

    <h1>🌿 ALOE GLOW</h1>

    <div class="tag">
      Belleza natural, resultados reales.
    </div>

    <img
      class="avatar"
      src="aloecito.png"
      alt="Aloecito"
    >

    <b>🤖 ALOECITO IA</b>

    <p>
      Tu ayudante para piel, cabello y manos.
    </p>

    <button
      class="chip"
      onclick="quick('Quiero cuidar mi piel')"
    >
      🧴 Cuidado de la piel
    </button>

    <button
      class="chip"
      onclick="quick('Quiero cuidar mi cabello')"
    >
      🧖 Cuidado del cabello
    </button>

    <button
      class="chip"
      onclick="quick('Quiero cuidar mis manos')"
    >
      🤲 Cuidado de manos
    </button>

    <button
      class="chip"
      onclick="quick('¿Qué productos tiene ALOE GLOW?')"
    >
      🛍️ Productos
    </button>

    <small>
      Orientación general. No diagnostica ni reemplaza a un profesional de salud.
    </small>

  </aside>


  <main>

    <div class="top">

      💚 Habla con Aloecito

      <span
        style="float:right;color:#55915a"
      >
        ● En línea
      </span>

    </div>


    <div
      id="chat"
      class="chat"
    ></div>


    <div class="quick">

      <button
        onclick="quick('Beneficios de la sábila para la piel')"
      >
        Piel
      </button>

      <button
        onclick="quick('Beneficios de la sábila para el cabello')"
      >
        Cabello
      </button>

      <button
        onclick="quick('¿Cómo cuido mis manos?')"
      >
        Manos
      </button>

      <button
        onclick="quick('Háblame de los productos')"
      >
        Productos
      </button>

    </div>


    <div class="input">

      <input
        id="i"
        type="text"
        autocomplete="off"
        autocorrect="on"
        placeholder="Escribe tu pregunta..."
        onkeydown="if(event.key==='Enter')send()"
      >

      <button
        id="sendButton"
        class="send"
        onclick="send()"
      >
        Enviar
      </button>

    </div>

  </main>

</div>


<script>

const chat = document.getElementById("chat");

const input = document.getElementById("i");

const sendButton = document.getElementById("sendButton");

let messages = [];


function scrollToBottom(){

  requestAnimationFrame(() => {

    chat.scrollTop = chat.scrollHeight;

  });

}


function add(text,user){

  const row = document.createElement("div");

  row.className =
    "msg " + (user ? "user" : "bot");


  if(!user){

    const image =
      document.createElement("img");

    image.src = "aloecito.png";

    image.className = "mini";

    image.alt = "Aloecito";

    row.appendChild(image);

  }


  const bubble =
    document.createElement("div");

  bubble.className = "bubble";


  if(user){

    bubble.textContent = String(text);

  }else{

    bubble.innerHTML =
      String(text)
        .replace(/\n/g,"<br>");

  }


  row.appendChild(bubble);

  chat.appendChild(row);

  scrollToBottom();

}


function showThinking(){

  const row =
    document.createElement("div");

  row.id = "thinking";

  row.className = "msg bot";


  const image =
    document.createElement("img");

  image.src = "aloecito.png";

  image.className = "mini";

  image.alt = "Aloecito";


  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent =
    "🌿 Pensando...";


  row.appendChild(image);

  row.appendChild(bubble);

  chat.appendChild(row);

  scrollToBottom();

}


function removeThinking(){

  const thinking =
    document.getElementById("thinking");

  if(thinking){

    thinking.remove();

  }

}


async function send(){

  const text =
    input.value.trim();


  if(!text){

    input.focus();

    return;

  }


  add(text,true);


  messages.push({

    role:"user",

    content:text

  });


  input.value = "";

  input.disabled = true;

  sendButton.disabled = true;

  sendButton.textContent = "...";


  showThinking();


  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            messages:messages
          })
        }
      );


    const data =
      await response.json();


    removeThinking();


    if(!response.ok){

      throw new Error(
        data.error ||
        "El servidor devolvió un error."
      );

    }


    if(
      !data.text ||
      typeof data.text !== "string"
    ){

      throw new Error(
        "La IA no devolvió una respuesta válida."
      );

    }


    add(data.text,false);


    messages.push({

      role:"assistant",

      content:data.text

    });


  }catch(error){

    removeThinking();


    add(
      "🌿 No pude responder en este momento.\n\n" +
      "Detalle: " +
      (error.message ||
      "Error desconocido."),
      false
    );

  }finally{

    input.disabled = false;

    sendButton.disabled = false;

    sendButton.textContent = "Enviar";

    input.focus();

  }

}


function quick(text){

  input.value = text;

  input.focus();

  send();

}


const welcome =
  "¡Hola! 🌿 Soy <b>Aloecito</b>, la IA de ALOE GLOW. " +
  "Puedo conversar contigo y ayudarte con el cuidado general " +
  "de la <b>piel, el cabello y las manos</b>, además de explicarte " +
  "cómo encaja la sábila en nuestros productos. " +
  "¿Qué quieres consultar?";


add(welcome,false);

</script>

</body>

</html>
